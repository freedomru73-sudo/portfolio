<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Портфолио — BRAGIN MEDIA</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <header>
        <a href="index.html" class="logo">BRAGIN <span>MEDIA</span></a>
        <input type="checkbox" id="mobile-menu-toggle" class="mobile-menu-checkbox">
        <label for="mobile-menu-toggle" class="mobile-menu-button">
            <span></span><span></span><span></span>
        </label>
        <nav id="main-nav">
            <a href="index.html">Главная</a>
            <a href="portfolio.html" class="active">Портфолио</a>
            <a href="index.html#about">Обо мне</a>
            <a href="index.html#reviews">Отзывы</a>
            <a href="index.html#contact" class="button-nav">Связаться</a>
        </nav>
    </header>

    <main>
        <section class="section bg-light" id="portfolio">
            <div class="section-header">
                <h2>Портфолио</h2>
                <p>Выберите тип работ, чтобы посмотреть категории и проекты.</p>
            </div>
            
            <!-- Переключатель Видео / Фото -->
            <div class="portfolio-toggle" id="portfolio-toggle">
                <!-- Кнопки генерируются через JS -->
            </div>

            <div class="accordion" id="portfolio-accordion">
                <!-- Аккордеон генерируется через JS -->
            </div>
        </section>
    </main>

    <!-- Модальное окно -->
    <div id="media-modal" class="modal">
        <div class="modal-content">
            <span class="modal-close">&times;</span>
            <div id="modal-body"></div>
        </div>
    </div>

    <footer>
        <p>© 2026 BRAGIN MEDIA. Все права защищены.</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
